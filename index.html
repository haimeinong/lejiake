<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>车间生产工作台</title>
<meta name="theme-color" content="#1f2a44">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="生产工作台">
<meta name="format-detection" content="telephone=no">
<style>
/* SECTION: base-css */
:root { --ink:#24314d; --gray:#6b7280; --line:#d5dae2; --bg:#eef1f5; --panel:#fff; --blue:#2e5395; --blue-d:#1f2a44; --green:#1a7f4e; --amber:#b45f06; --red:#b42318; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; font-size:14px; }
header.top { background:var(--blue-d); color:#fff; padding:0 16px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; position:sticky; top:0; z-index:20; box-shadow:0 2px 6px rgba(0,0,0,.25); }
header.top .brand { font-weight:700; font-size:16px; padding:12px 12px 12px 0; letter-spacing:1px; }
header.top .navbtn { color:#cdd6e4; text-decoration:none; padding:13px 16px; font-size:14px; border:none; background:none; cursor:pointer; border-bottom:3px solid transparent; }
header.top .navbtn:hover { color:#fff; }
header.top .navbtn.on { color:#fff; border-bottom-color:#4f8ff7; background:rgba(255,255,255,.06); }
header.top .spacer { flex:1; }
header.top button.ghost { border:1px solid #4a5878; background:transparent; color:#cdd6e4; border-radius:4px; padding:5px 12px; cursor:pointer; font-size:12px; }
header.top button.ghost:hover { color:#fff; border-color:#8fa4c8; }
main { max-width:1240px; margin:0 auto; padding:18px 14px 80px; }
.view { display:none; } .view.on { display:block; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:6px; margin-bottom:16px; box-shadow:0 1px 2px rgba(20,30,60,.05); }
.card > h2 { margin:0; font-size:15px; background:#f3f5f9; padding:10px 14px; border-bottom:1px solid var(--line); border-radius:6px 6px 0 0; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.pad { padding:14px; }
.rowflex { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.muted { color:var(--gray); font-size:12px; }
/* SECTION: control-css */
button { cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:4px; padding:5px 12px; font-size:13px; color:var(--ink); }
button:hover { background:#f0f3f8; }
button.pri { background:var(--blue); border-color:var(--blue); color:#fff; }
button.pri:hover { background:#27467d; }
button.danger { color:var(--red); }
input[type=text],input[type=number],input[type=date],input[type=search],textarea,select { font:inherit; border:1px solid var(--line); border-radius:4px; padding:6px 8px; background:#fff; color:var(--ink); }
input:focus,select:focus,textarea:focus { outline:2px solid #b9cdf0; border-color:var(--blue); }
textarea { width:100%; min-height:150px; line-height:1.8; }
.form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; align-items:end; }
.fld label { display:block; font-size:12px; color:var(--gray); margin-bottom:3px; }
.fld input,.fld select { width:100%; }
/* SECTION: report-line */
.rp-bar { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; background:#f8fafd; border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
.rp-mode { display:inline-flex; align-items:center; gap:10px; flex:none; }
.rp-mode b { font-size:12px; color:var(--gray); font-weight:600; }
.rp-mode label { display:inline-flex; align-items:center; gap:4px; font-size:13px; margin:0; color:var(--ink); }
.rp-mode input[type=radio] { width:auto; accent-color:var(--blue); }
.rp-i { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--gray); flex:none; }
.rp-i input { width:72px; padding:4px 6px; font-size:13px; }
.rp-i input[type=text] { width:100px; }
.rp-i input[type=date] { width:128px; }
.rp-i select { padding:4px 6px; font-size:13px; width:auto; max-width:120px; }
.rp-i[hidden] { display:none; }
.rp-gap { flex:1; min-width:0; }
@media (max-width:768px) { .rp-i select{max-width:150px;} }
/* SECTION: table-css */
.tw { overflow-x:auto; }
table.grid { border-collapse:collapse; width:100%; font-size:13px; }
table.grid th { background:#f3f5f9; text-align:left; padding:8px 10px; border:1px solid var(--line); white-space:nowrap; font-weight:600; }
table.grid td { padding:8px 10px; border:1px solid var(--line); vertical-align:middle; }
table.grid tr:hover td { background:#f8fafd; }
td.num,th.num { text-align:right; }
.badge { display:inline-block; font-size:12px; padding:2px 10px; border-radius:10px; white-space:nowrap; }
.b-idle { background:#eceff3; color:#5b6470; }
.b-doing { background:#e2ecfb; color:var(--blue); }
.b-done { background:#dff3e8; color:var(--green); }
.b-late { background:#fde8e6; color:var(--red); }
.bar { background:#e6eaf1; border-radius:6px; height:10px; overflow:hidden; min-width:90px; }
.bar i { display:block; height:100%; background:var(--blue); border-radius:6px; transition:width .3s; }
.bar i.g { background:var(--green); } .bar i.r { background:var(--red); }
.pct { font-size:12px; font-weight:700; min-width:42px; display:inline-block; text-align:right; }
/* SECTION: tabs-board-canvas */
.tabbar { display:flex; gap:6px; flex-wrap:wrap; }
.tabbar button { border-radius:16px; padding:6px 16px; }
.tabbar button.on { background:var(--blue); border-color:var(--blue); color:#fff; }
.kwrap { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
.kcard { border:1px solid var(--line); border-radius:6px; background:#fff; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
.kcard h3 { margin:0; font-size:15px; display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; }
.krow { display:flex; align-items:center; gap:8px; font-size:12px; }
.krow .pn { width:88px; flex:none; color:var(--gray); }
.krow .bar { flex:1; }
.kmeta { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; color:var(--gray); font-size:12px; }
table.canvas { border-collapse:collapse; width:100%; }
table.canvas td { border:1px solid var(--line); padding:8px 10px; vertical-align:top; }
td.lab { background:#f3f5f9; width:96px; font-weight:700; text-align:center; }
.rowtitle { background:#f3f5f9; font-weight:700; padding:9px 12px; border:1px solid var(--line); border-bottom:none; border-radius:6px 6px 0 0; }
.rowtitle.dnh { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.stages { display:flex; gap:12px; flex-wrap:wrap; }
.stage { flex:1 1 160px; min-width:150px; }
.stage .sname { border:2px dashed #9aa8c0; text-align:center; padding:7px 6px; font-weight:600; margin-bottom:8px; background:#f8fafd; border-radius:4px; }
.steps { display:flex; flex-wrap:wrap; gap:5px; }
.step { border:1.5px solid #6a7a95; background:#fff; padding:5px 8px; font-size:12px; border-radius:3px; }
.tools { display:flex; gap:12px; flex-wrap:wrap; }
.tgroup { flex:1 1 160px; min-width:150px; border:1px dashed var(--line); padding:7px; display:flex; gap:5px; flex-wrap:wrap; align-content:flex-start; border-radius:4px; }
.iface-tag { border:1.5px dashed #b7a04a; background:#fffbe8; padding:5px 8px; font-size:12px; text-align:center; border-radius:3px; }
.iface-tag b { color:#8a6d1a; font-weight:600; }
.tool { border:1.5px solid #6a7a95; background:#fff; padding:6px 9px; font-size:12px; border-radius:3px; }
.flow { display:flex; align-items:stretch; gap:6px; overflow-x:auto; padding:6px 2px; }
.fnode { background:#fff; border:1.5px solid #6a7a95; padding:8px 12px; min-width:110px; border-radius:4px; }
.fnode b { display:block; font-size:13px; margin-bottom:4px; }
.fnode span { display:block; font-size:11px; color:var(--gray); }
.farr { align-self:center; color:#6a7a95; font-size:18px; }
.dir-item { display:flex; justify-content:space-between; gap:10px; align-items:center; border-bottom:1px dashed var(--line); padding:10px 4px; flex-wrap:wrap; }
.dir-item:last-child { border-bottom:none; }
.dir-item .t { font-weight:600; }
.dir-item .m { color:var(--gray); font-size:12px; }
a.link { color:var(--blue); text-decoration:none; }
.editrow { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:6px; }
.chips { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.chip { background:#e8edf5; color:var(--blue); font-size:12px; padding:4px 12px; border-radius:10px; }
.toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--blue-d); color:#fff; padding:9px 20px; border-radius:20px; font-size:13px; opacity:0; transition:.3s; pointer-events:none; z-index:50; }
.toast.show { opacity:.95; }
.empty { text-align:center; color:var(--gray); padding:26px 10px; font-size:13px; }
/* SECTION: feature-css */
.ovl { position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:60; display:flex; align-items:center; justify-content:center; padding:14px; }
.ovl .box { background:#fff; border-radius:8px; width:100%; max-width:960px; max-height:90vh; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(0,0,0,.3); }
.ovl .box > h3 { margin:0; padding:12px 16px; border-bottom:1px solid var(--line); font-size:15px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.ovl .obox { padding:12px 16px; overflow:auto; }
.ovl .fbot { padding:10px 16px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; align-items:center; flex-wrap:wrap; }
input.mini { width:88px; padding:3px 6px; text-align:right; }
input.unit { width:58px; padding:3px 6px; }
.err { color:var(--red); font-size:12px; } .warn { color:var(--amber); font-size:12px; }
.note { background:#f6f7fa; border:1px dashed var(--line); border-radius:6px; padding:8px 12px; font-size:12px; color:var(--gray); margin-bottom:12px; line-height:1.7; }
.subblock { border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:14px; background:#fcfdff; }
.subblock > h4 { margin:0 0 6px; font-size:13px; }
.chkline { display:flex; align-items:center; gap:6px; min-height:34px; font-size:13px; }
button.mini-btn { padding:3px 9px; font-size:12px; }
tr.isdone td { background:#f4fbf7; }
.impbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
button { touch-action:manipulation; }
html { -webkit-text-size-adjust:100%; }
body { -webkit-tap-highlight-color:rgba(31,42,68,.08); overscroll-behavior-y:none; }
/* SECTION: pwa-shell */
.savestate { font-size:11px; color:#9fb0cc; white-space:nowrap; }
.mobnav { display:none; }
.sw-update { position:fixed; right:14px; bottom:76px; z-index:55; background:var(--green); color:#fff; border:none; border-radius:20px; padding:9px 18px; font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.25); }
header.top #btn-reset { white-space:nowrap; }
/* SECTION: responsive-tablet */
@media (max-width:768px) {
  td.lab { width:64px; }
  .stage { flex:1 1 100%; }
  main { padding:12px 10px 70px; }
  .kwrap { grid-template-columns:1fr; }
  /* 看板卡片工序行：名称/数值一行，进度条独占一行 */
  .krow { flex-wrap:wrap; }
  .krow .pn { width:auto; flex:0 0 auto; }
  .krow .bar { flex:1 1 100%; order:3; min-width:0; }
  .krow .muted { margin-left:auto; text-align:right; min-width:0 !important; }
  #board-kw { width:100%; }
  .ovl .box { max-width:100%; }
}
/* SECTION: responsive-phone */
@media (max-width:640px) {
  body { font-size:14px; }
  header.top { padding:6px 10px; gap:4px; flex-wrap:nowrap; overflow-x:auto; }
  header.top .brand { font-size:15px; padding:8px 6px 8px 0; flex:none; }
  header.top .navbtn { display:none; }
  header.top .spacer { display:none; }
  header.top .ghost { padding:6px 10px; font-size:12px; flex:none; }
  header.top #btn-reset { display:none; }
  .savestate { display:none; }
  main { padding:10px 8px calc(76px + env(safe-area-inset-bottom)); }
  .card { margin-bottom:12px; border-radius:8px; }
  .card > h2 { padding:10px 12px; gap:8px; }
  .pad { padding:12px 10px; }
  /* 触控区域放大；输入框字号 16px 防止 iPhone 自动放大 */
  button { min-height:38px; padding:7px 14px; font-size:14px; }
  button.mini-btn { min-height:32px; padding:5px 10px; }
  .tabbar button { padding:8px 16px; min-height:36px; flex:none; }
  .tabbar { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; flex:1 1 100%; }
  [hidden] { display:none !important; }
  input[type=text],input[type=number],input[type=date],input[type=search],textarea,select { font-size:16px; min-height:38px; }
  input.mini { width:120px; min-height:34px; }
  input.unit { width:90px; min-height:34px; }
  .form-grid { grid-template-columns:1fr; gap:12px; }
  /* 报工单行表单在手机上纵向铺开 */
  .rp-bar { flex-direction:column; align-items:stretch; gap:10px; }
  .rp-i { width:100%; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .rp-i input, .rp-i select { flex:1 1 auto; width:auto !important; min-width:0; max-width:none !important; }
  .rp-mode { width:100%; justify-content:space-between; }
  .rp-bar .pri { width:100%; padding:11px; font-size:15px; margin-top:2px; }
  /* 表格卡片化（仅对带 data-label 的列显示标签） */
  .tw { overflow:visible; }
  table.grid { display:block; }
  table.grid tr:first-child { display:none; }
  table.grid tr { display:block; border:1px solid var(--line); border-radius:8px; margin:0 0 10px; padding:2px 10px; background:#fff; }
  table.grid tr:hover td { background:transparent; }
  tr.isdone { background:#f4fbf7; }
  table.grid td { display:flex; justify-content:space-between; align-items:center; gap:14px; border:none; border-bottom:1px dashed #e3e7ee; padding:8px 0; text-align:right; white-space:normal !important; }
  table.grid td::before { content:attr(data-label); color:var(--gray); font-size:12px; flex:none; text-align:left; }
  table.grid td:last-child { border-bottom:none; }
  table.grid td .muted { text-align:right; }
  /* 工作画布表格纵向化 */
  table.canvas, table.canvas tbody { display:block; }
  table.canvas tr { display:block; }
  table.canvas td { display:block; }
  table.canvas td.lab { width:auto; text-align:left; }
  .flow { font-size:12px; }
  .fnode { min-width:96px; }
  /* 弹窗全屏化 */
  .ovl { padding:0; }
  .ovl .box { max-width:100%; max-height:100%; height:100%; border-radius:0; }
  .ovl .obox { padding:12px; }
  .ovl .fbot { padding:10px 12px calc(10px + env(safe-area-inset-bottom)); position:sticky; bottom:0; background:#fff; }
  .ovl .fbot button { flex:1 1 auto; min-height:42px; }
  /* Toast 上移，避开底部导航 */
  .toast { bottom:calc(84px + env(safe-area-inset-bottom)); max-width:90vw; text-align:center; }
  .sw-update { bottom:calc(82px + env(safe-area-inset-bottom)); }
  /* 底部导航 */
  .mobnav { display:flex; position:fixed; left:0; right:0; bottom:0; z-index:40; background:#fff; border-top:1px solid var(--line); box-shadow:0 -2px 10px rgba(20,30,60,.08); padding-bottom:env(safe-area-inset-bottom); }
  .mobnav button { flex:1 1 0; border:none; background:none; border-radius:0; border-top:3px solid transparent; padding:7px 0 7px; min-height:56px; font-size:12px; color:#5b6470; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .mobnav button .mi { font-size:19px; line-height:1; color:#8a94a6; font-weight:700; }
  .mobnav button.on { color:var(--blue); font-weight:700; border-top-color:var(--blue); background:#f6f9ff; }
  .mobnav button.on .mi { color:var(--blue); }
  .note { line-height:1.8; }
}
</style>
</head>
<body>
<header class="top">
  <span class="brand">车间生产工作台</span>
  <button class="navbtn on" data-nav="data">① 生产数据记录</button>
  <button class="navbtn" data-nav="board">② 生产进度看板</button>
  <button class="navbtn" data-nav="canvas">③ 工作画布</button>
  <span class="spacer"></span>
  <span class="savestate" id="save-state"></span>
  <button class="ghost" id="btn-install">安装 App</button>
  <button class="ghost" id="btn-store" title="数据保存状态、备份与恢复">数据状态</button>
  <button class="ghost" id="btn-reset" title="恢复内置示例记录">重置示例数据</button>
</header>
<main>
  <div id="view-data" class="view on"></div>
  <div id="view-board" class="view"></div>
  <div id="view-canvas" class="view"></div>
</main>
<nav class="mobnav" aria-label="主导航">
  <button class="on" data-nav="data"><span class="mi">①</span><span>数据记录</span></button>
  <button data-nav="board"><span class="mi">②</span><span>进度看板</span></button>
  <button data-nav="canvas"><span class="mi">③</span><span>工作画布</span></button>
</nav>
<button class="sw-update" id="sw-update" hidden>↻ 发现新版本，点击刷新</button>
<div id="toast" class="toast"></div>
<div id="modal-root"></div>
<input type="file" id="import-file" accept=".json,application/json" style="display:none">
<input type="file" id="import-xlsx" accept=".csv,.txt" style="display:none">
<input type="file" id="restore-file" accept=".json,application/json" style="display:none">

function planStats(p){
  var procs = (p.processes||[]).filter(function(x){return x;});
  if(!procs.length) procs = ['（未配置工序）'];
  var anyReport = false, rows = [], sumRate = 0, allDone = true;
  procs.forEach(function(pr, idx){
    var ok=0, rep=0, ng=0, done=false, cnt=0;
    actReports(p.id).forEach(function(r){
      if(r.process!==pr) return;
      anyReport=true; cnt++;
      if(r.done){ done=true; }
      else { rep+=+r.qty||0; ok+=+r.okQty||0; ng+=+r.ngQty||0; }
    });
    var planInfo = procPlanQty(p,pr,idx);
    var planQ = planInfo.qty;
    var isFirst = idx===0;
    var pkProc = pickSumByProc(p,pr,'qtyGot');
    var pickGot = pkProc.sum;
    var unit = procUnit(p,pr);
    var rate, dispRep=rep, dispOk=ok;
    if(done){
      allDone = allDone && true;
      rate = 100;
      /* 已完成工序：报工/合格数按计划数计，无需再对数量 */
      dispRep = planQ; dispOk = planQ;
    } else {
      allDone = false;
      if(isFirst && cnt===0 && pickGot>0){ /* 首道工序尚无报工但有领料：以实领数作为在制数展示 */
        dispRep = pickGot; dispOk = pickGot;
      }
      rate = planQ>0 ? Math.min(100, dispOk/planQ*100) : 0;
    }
    if(!anyReport) allDone=false;
    sumRate += rate;
    rows.push({ process:pr, idx:idx, unit:unit, plan:planQ, planSrc:planInfo.src, rep:dispRep, ok:dispOk, ng:ng, rawRep:rep, rawOk:ok, pickGot:pickGot, rate:rate, done:done, cnt:cnt, isFirst:isFirst });
  });
  var overall = rows.length ? Math.round(sumRate/rows.length) : 0;
  var status;
  if (allDone && anyReport && overall>=100) status='已完成';
  else if (overall>=100 && anyReport) status='已完成';
  else if (todayStr() > p.due) status='逾期';
  else if (anyReport) status='进行中';
  else status='未开工';
  return { rows:rows, overall:overall, status:status };
}

function doneBlock(){
  var allActive = activePlans();
  if(!allActive.length) return '<div class="empty">暂无在制订单。可在「历史记录」中查看或恢复已归档订单。</div>';
  var list = allActive.filter(function(p){
    var st=planStats(p);
    if(doneFilter!=='全部' && st.status!==doneFilter) return false;
    if(doneQuery){
      var q=doneQuery.toLowerCase();
      var hay=(p.orderNo+' '+planLabel(p)+' '+p.product+' '+(p.matCode||'')+' '+(p.spec||'')).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  var stat = planCountStats();
  var doneCount = allActive.filter(function(p){ return planStats(p).status==='已完成'; }).length;
  var filterBar = '<div class="chips" style="margin:10px 0 12px;flex-wrap:wrap;gap:8px;">'
    + ['全部','未开工','进行中','已完成','逾期'].map(function(f){ return '<button class="'+(doneFilter===f?'pri':'')+'" data-df="'+f+'">'+f+'</button>'; }).join('')
    + '<input type="search" id="done-kw" placeholder="搜索订单号/产品/物料编码" value="'+esc(doneQuery)+'" style="width:210px;">'
    + '<button class="mini-btn'+(doneCount?' pri':'')+'" data-act="arc-all-done" title="'+(doneCount?('一键归档全部已完成订单（共 '+doneCount+' 个）'):'当前没有已完成的订单')+'">归档全部已完成订单（'+doneCount+'）</button>'
    + '</div>';
  var countLine = '<div class="chips" style="margin-bottom:12px;">'
    + '<span class="chip">在制订单 '+stat.total+'</span>'
    + '<span class="chip">进行中 '+stat.doing+'</span>'
    + '<span class="chip">已完成 '+stat.done+'</span>'
    + '<span class="chip" style="background:#fde8e6;color:var(--red);">逾期 '+stat.late+'</span>'
    + '<span class="chip" style="background:#eceff3;color:#5b6470;">未开工 '+stat.idle+'</span>'
    + '<span class="chip" style="background:#eef7ee;color:var(--green);">筛选结果 '+list.length+'</span></div>';
  var html='';
  if(!list.length){
    html='<div class="empty">该筛选条件下暂无订单。可点击上方「全部」查看所有在制订单。</div>';
  } else {
    list.forEach(function(p){
      var st = planStats(p);
      var ed = !!editDoneIds[p.id];
      html += '<div class="rowtitle dnh">'+esc(p.orderNo)+' · '+esc(p.matCode||'—')+' · '+esc(p.product)+'（成品计划 '+fmtN(p.planQty)+' '+esc(p.unit||'')+'，'+esc(p.spec)+'）　整体完成率 '+Math.round(st.overall)+'%　'+statusBadge(st.status)
        + '<span style="flex:1;"></span>'
        + (ed?'<span class="badge b-doing">编辑中：可直接修改单位与计划数</span>':'')
        + '　<button class="mini-btn'+(ed?' pri':'')+'" data-act="edit-done" data-id="'+p.id+'">'+(ed?'完成编辑':'编辑')+'</button>'
        + '　<button class="mini-btn" data-act="arc-plan" data-id="'+p.id+'">归档该订单</button></div>';
      html += '<div class="tw" style="margin-bottom:14px;"><table class="grid"><tr><th>工序</th><th>单位</th><th class="num">计划数</th><th class="num">领料实领</th><th class="num">报工总数</th><th class="num">合格数</th><th class="num">不合格</th><th style="min-width:150px;">完成率</th><th>说明</th></tr>';
      st.rows.forEach(function(r){
        var unitCell, planCell;
        if(ed){
          unitCell = '<td data-label="单位"><input class="unit" type="text" value="'+esc(r.unit)+'" data-act="unit" data-id="'+p.id+'" data-proc="'+esc(r.process)+'" title="修改该工序计量单位"></td>';
          planCell = '<td class="num" data-label="计划数"><input class="mini" type="number" value="'+(r.plan===null||r.plan===undefined?'':r.plan)+'" data-act="planqty" data-id="'+p.id+'" data-proc="'+esc(r.process)+'" title="可编辑计划数"></td>';
        } else {
          unitCell = '<td class="muted" data-label="单位">'+esc(r.unit||'—')+'</td>';
          planCell = '<td class="num" data-label="计划数">'+fmtN(r.plan)+'</td>';
        }
        html += '<tr'+(r.done?' class="isdone"':'')+'><td data-label="工序">'+esc(r.process)+(r.done?' <span class="badge b-done">✔完成</span>':'')+'</td>'
          + unitCell + planCell
          + '<td class="num" data-label="领料实领">'+fmtN(r.pickGot)+'</td><td class="num" data-label="报工总数">'+fmtN(r.rep)+'</td>'
          + '<td class="num" data-label="合格数" style="color:var(--green);font-weight:600;">'+fmtN(r.ok)+'</td>'
          + '<td class="num" data-label="不合格" style="color:'+(+r.ng>0?'var(--red)':'inherit')+';">'+fmtN(r.ng)+'</td>'
          + '<td data-label="完成率">'+barHtml(r.rate)+'</td><td class="muted" data-label="说明">'+(r.done?'已点选完成，按 100% 计':(r.isFirst&&!r.cnt&&r.pickGot>0?'首道工序：按领料实领数计':'计划数'+r.planSrc+'；报工 '+r.cnt+' 次'))+'</td></tr>';
      });
      html += '</table></div>';
    });
  }
  var note='<div class="note"><b>计算口径</b>：① <b>计划数</b>按工序分别取值——手工填写优先，首道工序未填写时自动取该订单<b>领料应领数合计</b>，其余工序默认取订单成品计划数；② <b>报工总数/合格数/不合格数</b>由该工序全部有效报工记录自动汇总，首道工序未报工时以<b>实领数</b>作为在制数；③ 已点选<b>「直接完成」</b>的工序完成率固定为 100%，不再比对数量。单位不同的工序各按自己的计划数计算，互不干扰。<br>④ 本页面默认为<b>预览状态</b>；需调整某订单的<b>计量单位</b>或<b>工序计划数</b>时，点该订单右侧的<b>「编辑」</b>按钮，改完点「完成编辑」回到预览。<b>归档该订单</b>会一并把该订单的排产计划、领料记录、报工记录转入「历史记录」。<br>⑤ 顶部可按<b>状态</b>或<b>关键字</b>筛选订单；已<b>完工（状态为「已完成」）</b>的订单可直接点<b>「归档全部已完成订单」</b>一键转入历史记录。</div>';
  return filterBar + countLine + html + note;
}

    +'<div class="fld" style="margin-bottom:10px;"><label>归档说明（可选）</label><input type="text" id="ar-note" style="width:100%;" placeholder="如：订单已完工入库 / 客户暂停，留存备查"></div>'
    +'<div class="muted" style="margin-top:10px;">归档对象：'+esc(planLabel(p))+'</div>';
  openModal('归档订单', body, '<button data-m="close">取消</button><button class="pri" data-m="do-archive" data-kind="plan" data-id="'+esc(id)+'">确认归档</button>');
}
function doArchive(kind,id,note){
  var t=todayStr();
  function mark(o){ o.archived=true; o.archivedAt=t; o.archivedNote=note||''; }
  var p=planById(id); if(!p) return;
  mark(p);
  delete editDoneIds[id];
  S.pickings.forEach(function(k){ if(k.planId===id) mark(k); });
  S.reports.forEach(function(r){ if(r.planId===id) mark(r); });
  save(); closeModal(); renderAll(); toast('订单【'+p.orderNo+'】及其领料、报工记录已归档');
}
function unarchive(kind,id){
  var planId=null, tip='';
  function back(o){ o.archived=false; delete o.archivedAt; delete o.archivedNote; }
  if(kind==='plan'){
    var p=planById(id); if(!p) return; back(p);
    var cnt=0;
    S.pickings.forEach(function(k){ if(k.planId===id && k.archived){ back(k); cnt++; } });
    S.reports.forEach(function(r){ if(r.planId===id && r.archived){ back(r); cnt++; } });
    if(cnt) tip='（含其下 '+cnt+' 条领料/报工记录一并恢复）';
  }
  else if(kind==='pick'){ S.pickings.forEach(function(k){ if(k.id===id){ back(k); planId=k.planId; } }); }
  else { S.reports.forEach(function(r){ if(r.id===id){ back(r); planId=r.planId; } }); }
  if(planId){ var pp=planById(planId); if(pp&&pp.archived){ back(pp); tip='（所属订单一并恢复）'; } }
  save(); renderAll(); toast('已恢复到在制列表'+tip);
}
function purge(kind,id){
  if(!confirm('彻底删除后不可恢复、不可追溯，确定继续？\n（如仅需从主页面移出，请改用「归档」）')) return;
  if(kind==='plan'){
    var p=planById(id);
    S.plans=S.plans.filter(function(x){return x.id!==id;});
    S.pickings=S.pickings.filter(function(x){return x.planId!==id;});
    S.reports=S.reports.filter(function(x){return x.planId!==id;});
    if(p) toast('已彻底删除订单【'+p.orderNo+'】及其全部记录');
  } else if(kind==='pick'){ S.pickings=S.pickings.filter(function(x){return x.id!==id;}); toast('已彻底删除该领料记录'); }
  else { S.reports=S.reports.filter(function(x){return x.id!==id;}); toast('已彻底删除该报工记录'); }
  save(); renderAll();
}

function fillProcOptions(selPlanId, selProcId, unitId){
  var pe=document.getElementById(selPlanId); if(!pe) return;
  var p = planById(pe.value);
  var sel = document.getElementById(selProcId); if(!sel) return;

  showUnit(p, sel.value, unitId);
}
function showUnit(p, proc, unitId){
  if(!unitId) return;
  var el=document.getElementById(unitId); if(!el) return;

function bindPlanForm(){
  var btn = document.getElementById('btn-plan-save'); if(!btn) return;
  btn.onclick = function(){
    var v = function(id){ var e=document.getElementById(id); return e?e.value.trim():''; };
    var orderNo=v('f-po'), product=v('f-pd'), qty=+v('f-pq');
    if(!orderNo||!product||!(qty>0)){ toast('请填写订单号、产品名称与有效的成品计划数'); return; }
    if(!editPlanId && S.plans.some(function(x){ return x.orderNo===orderNo; })){ toast('订单号已存在：'+orderNo); return; }
    var procs = v('f-prc').split(/[、，,;；]+/).map(function(x){return x.trim();}).filter(function(x){return x;});
    if(!procs.length) procs=['（未配置工序）'];
    var metas = v('f-pqq').split(/[、，,;；]+/);
    var base = { orderNo:orderNo, matCode:v('f-mc'), product:product, spec:v('f-ps'), planQty:qty, unit:v('f-pun')||'件', processes:procs, start:v('f-pt'), due:v('f-pu') };
    if(editPlanId){
      var p=planById(editPlanId); if(!p) return;
      var oldMeta=p.procMeta||{};
      for(var k in base) p[k]=base[k];
      p.procMeta={};
      procs.forEach(function(pr,i){
        var prev=oldMeta[pr]||{};
        var raw=(metas[i]||'').trim();
        var m={ unit: prev.unit || (i===0?'kg':base.unit), qty: (typeof prev.qty==='number'?prev.qty:null) };
        if(raw){
          var parts=raw.split(/[\/／]/);
          var q=parts[0].trim(), u=(parts[1]||'').trim();
          if(q!==''&&!isNaN(+q)) m.qty=+q; else if(q==='') m.qty=null;
          if(u) m.unit=u;
        }
        p.procMeta[pr]=m;
      });
      editPlanId=null; toast('排产单已更新');
    } else {
      base.id = uid(); base.procMeta={}; base.archived=false;
      procs.forEach(function(pr,i){
        var raw=(metas[i]||'').trim();
        var m={ unit: i===0?'kg':base.unit, qty:null };
        if(raw){
          var parts=raw.split(/[\/／]/);
          var q=parts[0].trim(), u=(parts[1]||'').trim();
          if(q!==''&&!isNaN(+q)) m.qty=+q;
          if(u) m.unit=u;
        }
        base.procMeta[pr]=m;
      });
      S.plans.push(base); toast('已新增排产计划：'+orderNo);
    }
    save(); renderAll();
  };
  var cancel = document.getElementById('btn-plan-cancel');
  if(cancel) cancel.onclick = function(){ editPlanId=null; renderData(); bindPlanForm(); bindProcSelects(); };
}
function bindProcSelects(){
  var a=document.getElementById('f-kp'), b=document.getElementById('f-rp');
  if(a){ a.onchange=function(){ fillProcOptions('f-kp','f-kpr','f-kunit'); }; fillProcOptions('f-kp','f-kpr','f-kunit'); }
  if(b){ b.onchange=function(){ fillProcOptions('f-rp','f-rpr','f-runit'); }; fillProcOptions('f-rp','f-rpr','f-runit'); }
  var pr=document.getElementById('f-rpr');
  if(pr) pr.onchange=function(){ showUnit(planById(document.getElementById('f-rp').value), this.value, 'f-runit'); };
  var kpr=document.getElementById('f-kpr');
  if(kpr) kpr.onchange=function(){ showUnit(planById(document.getElementById('f-kp').value), this.value, 'f-kunit'); };
  var rmN=document.getElementById('rmode-num'), rmD=document.getElementById('rmode-done'), tip=document.getElementById('rmode-tip');
  function syncMode(){
    var done = rmD && rmD.checked;
    ['fld-rq','fld-ro','fld-rn'].forEach(function(fid){ var e=document.getElementById(fid); if(e) e.hidden = !!done; });
    ['f-rq','f-ro','f-rn'].forEach(function(fid){ var e=document.getElementById(fid); if(e){ e.disabled=!!done; if(done) e.value=''; } });
    if(tip) tip.innerHTML = done ? '已选择「直接完成」：该工序验收后视为完成，完成率按 100% 计入，无需填写数量。' : '按实际产出填写数量；合格数 + 不合格数不应大于报工数量。';
  }
  if(rmN){ rmN.onchange=syncMode; } if(rmD){ rmD.onchange=syncMode; } syncMode();
  var pb=document.getElementById('btn-pick-add');
  if(pb) pb.onclick=function(){
    var gv=function(id){ var e=document.getElementById(id); return e?e.value.trim():''; };
    if(!gv('f-km')||!gv('f-kw')){ toast('请填写物料名称与领料人'); return; }
    var need=+gv('f-kn'), got=+gv('f-kg');
    if(!(need>0)||!(got>=0)){ toast('请填写有效的应领/实领数量'); return; }
    var planId=gv('f-kp'); if(!planId){ toast('请选择生产订单'); return; }
    S.pickings.push({ id:uid(), planId:planId, process:document.getElementById('f-kpr').value, matCode:gv('f-kb'), material:gv('f-km'), spec:gv('f-ks'), qtyNeed:need, qtyGot:got, picker:gv('f-kw'), date:gv('f-kd'), archived:false });
    save(); renderAll(); toast('领料已登记，完成情况已联动更新');
  };
  var rb=document.getElementById('btn-report-add');
  if(rb) rb.onclick=function(){
    var gv=function(id){ var e=document.getElementById(id); return e?e.value.trim():''; };
    var planId=gv('f-rp'); if(!planId){ toast('请选择生产订单'); return; }
    var proc=document.getElementById('f-rpr').value;
    if(!proc){ toast('该订单未配置工序，请先在排产计划中填写工序清单'); return; }
    if(!gv('f-rw')){ toast('请填写报工人'); return; }
    var isDone = document.getElementById('rmode-done') && document.getElementById('rmode-done').checked;
    var rec={ id:uid(), planId:planId, process:proc, reporter:gv('f-rw'), shift:document.getElementById('f-rs').value, date:gv('f-rd'), archived:false };
    if(isDone){
      rec.done=true; rec.qty=null; rec.okQty=null; rec.ngQty=null;
    } else {
      var qty=+gv('f-rq'), ok=+gv('f-ro'), ng=+gv('f-rn')||0;
      if(!(qty>0)){ toast('请填写报工数量，或改选「直接完成」'); return; }
      if(!(ok>=0)){ toast('请填写合格数'); return; }
      if(ok+ng>qty){ toast('合格数 + 不合格数不能大于报工数量'); return; }
      rec.done=false; rec.qty=qty; rec.okQty=ok; rec.ngQty=ng;
    }
    S.reports.push(rec);
    save(); renderAll(); toast(isDone?'已记录「'+proc+'」完成，完成率按 100% 计入':'报工已提交，完成情况与看板已联动更新');
  };
}

      S.reports.forEach(function(r){ if(r.planId===p.id){ r.archived=true; r.archivedAt=t; r.archivedNote=r.archivedNote||'批量归档'; } });

  if(act==='del-plan'){ var p=planById(id); if(!p) return; if(confirm('删除排产单【'+p.orderNo+'】及其全部领料、报工记录？删除后不可追溯。\n如只想从主页面移出，请改用「归档」。')){ S.plans=S.plans.filter(function(x){return x.id!==id;}); S.pickings=S.pickings.filter(function(x){return x.planId!==id;}); S.reports=S.reports.filter(function(x){return x.planId!==id;}); save(); renderAll(); toast('已删除'); } }
  if(act==='del-pick'){ if(confirm('删除该领料记录？删除后不可追溯。\n如只想从主页面移出，请改用「归档」。')){ S.pickings=S.pickings.filter(function(x){return x.id!==id;}); save(); renderAll(); toast('已删除'); } }
  if(act==='del-report'){ if(confirm('删除该报工记录？完成情况将回退，删除后不可追溯。\n如只想从主页面移出，请改用「归档」。')){ S.reports=S.reports.filter(function(x){return x.id!==id;}); save(); renderAll(); toast('已删除'); } }
});

var cvEditing=false;
function cvFind(id){ for(var i=0;i<S.canvases.length;i++) if(S.canvases[i].id===id) return S.canvases[i]; return null; }
function cvCounts(c){ var st=0,tl=0; c.stages.forEach(function(g){ st+=g.steps.length; }); c.supports.forEach(function(g){ tl+=g.items.length; }); return {st:st,tl:tl}; }
function cvMigrateAll(){
  S.canvases.forEach(function(c){
    if(!Array.isArray(c.stages)) c.stages=[];
    if(!Array.isArray(c.stageIfaces)) c.stageIfaces=c.stages.map(function(){return '';});
    while(c.stageIfaces.length<c.stages.length) c.stageIfaces.push('');
    c.stageIfaces.length=c.stages.length;
    if(!Array.isArray(c.supports)) c.supports=[];
    while(c.supports.length<c.stages.length) c.supports.push({items:[]});
    c.supports.length=c.stages.length;
  });
  if(!Array.isArray(S.templates)) S.templates=[];
}

function csvCell(s){ s=String(s==null?'':s); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }

function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  var rows=[], row=[], cur='', q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true; else if(ch===','){ row.push(cur); cur=''; } else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; } else if(ch==='\r'){ /*skip*/ } else cur+=ch; }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim()!==''; }); });
}
function parsePaste(text){
  text=String(text||'').replace(/^\uFEFF/,'').replace(/\r/g,'');
  var rows = text.split('\n').filter(function(l){ return l.trim()!=='' && !/^-+$/.test(l.trim()); })
    .map(function(l){ return l.split('\t'); });
  if(rows.length===1 && rows[0].length===1) rows = parseCSV(text);
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim()!==''; }); });
}

function normH(s){ return String(s==null?'':s).replace(/[\s:：()（）*＊]/g,'').replace(/\/.*$/,''); }
function colMap(kind, header){
  var h = header.map(normH), map=[], hit=0;
  HDR[kind].forEach(function(al){

      if(!h[i]) continue;

        var k=normH(al[j]);
        if(h[i]===k || h[i].indexOf(k)===0 || k.indexOf(h[i])===0){ idx=i; break; }

    }
    if(idx>=0) hit++;
    map.push(idx);
  });
  return { map:map, hit:hit };
}

        if(!(qty>0)){ skip++; errs.push('第'+(ri+1)+'行：报工数量无效（验收类工序可把报工方式填「完成」）'); return; }
        rec.done=false; rec.qty=qty; rec.okQty=(okq===null?qty:okq); rec.ngQty=(ngq===null?0:ngq);
        if(rec.okQty+rec.ngQty>rec.qty){ errs.push('第'+(ri+1)+'行：合格数+不合格数大于报工数量，已按原值导入'); }
      }
      S.reports.push(rec); ok++;
    });
  }
  return {ok:ok,skip:skip,msg:'成功导入 '+ok+' 条'+(skip?'，跳过 '+skip+' 条':''),errs:errs};
}

function fixDate(v){
  v=String(v==null?'':v).trim(); if(!v) return '';
  var m=v.match(/^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})/); if(m) return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  m=v.match(/^(\d{1,2})[-\/.](\d{1,2})$/); if(m) return todayStr().slice(0,4)+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2);
  var d=new Date(v); if(!isNaN(+d) && /\d{4}/.test(v)) return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  return v;
}

    doArchive('plan',id,note); return;
  }

  if(m==='paste-import'){ doPasteImport(kind); return; }
  if(m==='pick-file'){ doPickFile(kind); return; }
  if(m==='pwa-install'){
    if(deferredPrompt){ var dp=deferredPrompt; deferredPrompt=null; dp.prompt(); dp.userChoice.then(function(){ closeModal(); refreshInstallBtn(); }); }
    return;
  }
  if(m==='persist'){ requestPersist().then(function(ok){ fillStoreStatus(); toast(ok?'持久化保护已开启':'未获授权，可在安装应用后再点此按钮'); }); return; }
  if(m==='cache-offline'){
    if(!('serviceWorker' in navigator)){ toast('当前环境不支持离线缓存'); return; }
    var sw=navigator.serviceWorker;
    var ctrl=sw.controller || (swReg && swReg.active);
    if(!ctrl){ toast('离线缓存尚未就绪：请先联网打开一次本应用'); return; }
    var ch=null;
    try { ch=new MessageChannel(); ctrl.postMessage({type:'CACHE_SHELL'},[ch.port2]); } catch(e){ ch=null; }
    if(ch){
      ch.port1.onmessage=function(){ toast('离线包已缓存完成，断网后也能打开'); fillStoreStatus(); };
      toast('正在缓存离线包…');
    } else {
      try { ctrl.postMessage({type:'CACHE_SHELL'}); toast('正在缓存离线包…'); } catch(e){ toast('缓存请求失败'); }
    }
    return;
  }
  if(m==='restore-file'){ document.getElementById('restore-file').click(); return; }
  if(m==='restore-snap'){ restoreSnapshot(id); return; }
  if(m==='reset-sample'){ closeModal(); resetSample(); return; }

var swReady=false, swReg=null;
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      swReg=reg;
      // 注册成功后主动预缓存离线包（即使安装阶段因个别资源失败，这里也能补上）
      if(navigator.serviceWorker.controller){
        try { navigator.serviceWorker.controller.postMessage({type:'CACHE_SHELL'}); } catch(e){}
      }
      navigator.serviceWorker.ready.then(function(){ swReady=true; });
      function promptWaiting(){
        if(!reg.waiting) return;
        var btn=document.getElementById('sw-update');
        if(!btn) return;
        btn.hidden=false;
        btn.onclick=function(){
          btn.hidden=true;
          navigator.serviceWorker.addEventListener('controllerchange', function(){ location.reload(); }, { once:true });
          reg.waiting.postMessage({type:'SKIP_WAITING'});
        };
      }
      promptWaiting();
      reg.addEventListener('updatefound', function(){
        var nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange', function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller) promptWaiting();
        });
      });
    }).catch(function(err){
      // 离线/安装失败不再静默：在控制台与状态面板给出明确提示
      console.warn('[SW] 注册失败：', err);
      var st=document.getElementById('st-offline');
      if(st) st.textContent='离线缓存不可用（注册失败）：请确认通过 https 或 localhost 打开，且 sw.js 可访问';
    });
  });
}

/* 直开本地文件 / 非安全上下文提醒：这是「离线/安装用不了」的最常见根因 */
(function(){
  function showEnvBanner(msg){
    var bar=document.createElement('div');
    bar.style.cssText='position:sticky;top:0;z-index:9999;background:#b42318;color:#fff;padding:10px 14px;font-size:13px;line-height:1.7;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.2)';
    bar.innerHTML=msg;
    var app=document.getElementById('app');
    if(app && app.parentNode) app.parentNode.insertBefore(bar, app);
    else document.body.insertBefore(bar, document.body.firstChild);
  }
  if(location.protocol==='file:'){
    showEnvBanner('<b>当前以本地文件方式打开，离线缓存与「安装为 App」均不可用。</b>请改用部署后的网址（如 GitHub Pages 的 https 链接）打开即可正常离线使用。');
  } else if(location.hostname!=='localhost' && location.hostname!=='127.0.0.1' && location.protocol!=='https:'){
    showEnvBanner('<b>当前并非安全连接（https），离线缓存与安装可能受限。</b>请通过 https 网址打开本应用。');
  }
})();
